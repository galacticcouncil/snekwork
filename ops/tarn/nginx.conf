# Swarm-side ingress shim for snekwork.
#
# tarn's traefik runs with `--providers.docker.swarmMode=true`, so its docker
# provider enumerates SWARM SERVICES ONLY and never sees a standalone Compose
# container's labels. snekwork is a Compose project (its ingestion-supervisor
# creates historical workers with `docker compose run` over the host socket,
# which Swarm has no equivalent for), so it cannot be discovered directly.
#
# This is the smallest bridge: a swarm service traefik CAN discover, doing
# nothing but passing through to the `snekwork-explorer-ui` Compose container
# over the attachable `gateway` overlay both are joined to.
server {
    listen 80;

    # Docker's embedded DNS, re-resolved on a short TTL: the upstream is a
    # Compose container whose IP changes on every `docker compose up`. A static
    # upstream name would be resolved once at startup and cached for the life of
    # the process, so the shim would 502 after the first UI rebuild.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream snekwork-explorer-ui:80;

    # No client_max_body_size bump: every route on this app is a GET.
    client_max_body_size 1m;

    location / {
        # proxy_pass with a variable does NOT forward the request URI on its
        # own, so it has to be appended explicitly.
        proxy_pass http://$upstream$request_uri;

        # 1.1 for two reasons: the upstream's gzip only engages for HTTP/1.1+
        # clients (it accepts 1.0 as a fallback, but then serves the entry chunk
        # uncompressed — 258 kB instead of 77 kB), and keepalive/SSE need it.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # /api/explorer/live is a long-lived server-sent-event stream. Buffering
        # anywhere in the chain holds frames until a buffer fills, which reads as
        # a dead stream. The upstream already micro-caches its /api responses, so
        # there is nothing for this hop to buffer or cache anyway.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # X-Accel-Buffering is an nginx-internal control header that each hop
        # CONSUMES without forwarding. Pass it on so hops in front of us (traefik,
        # any future CDN) also disable buffering for the SSE route.
        proxy_pass_header X-Accel-Buffering;
    }
}
