name: snekwork

services:
  clickhouse:
    build:
      context: ./clickhouse
      dockerfile: Dockerfile
    container_name: snekwork-clickhouse
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=price_data
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neckwork

  # Applies clickhouse/schema/*.sql to a fresh server before any ingestion or
  # API service starts. Runs once and exits 0 (nonzero on failure); everything
  # downstream gates on `service_completed_successfully` so nothing races an
  # empty/partial schema.
  schema-bootstrap:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: snekwork-api
    container_name: snekwork-schema-bootstrap
    restart: "no"
    command: ["./node_modules/.bin/tsx", "src/db/schemaBootstrap.ts", "--apply"]
    volumes:
      - ./clickhouse/schema:/schema:ro
    environment:
      - SCHEMA_DIR=/schema
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - neckwork

  indexer:
    image: snekwork-indexer:latest
    build: .
    container_name: snekwork-indexer
    profiles:
      - worker
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      - RPC_URL=${RPC_URL:-https://hydration-rpc.neckwork.net}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - RPC_RATE_LIMIT=${INDEXER_RPC_RATE_LIMIT:-100}
      - RPC_CAPACITY=${INDEXER_RPC_CAPACITY:-20}
      # Empty means "use the code default". Passing the knobs through is what
      # makes the 2s migration values and the deprecated-name warnings usable by
      # supervisor-created main-live workers.
      - RPC_HEAD_POLL_MS=${RPC_HEAD_POLL_MS:-}
      - SNAPSHOT_INTERVAL_MINUTES=${SNAPSHOT_INTERVAL_MINUTES:-}
      - SNAPSHOT_INTERVAL=${SNAPSHOT_INTERVAL:-}
      - BATCH_SIZE=${INDEXER_BATCH_SIZE:-10000}
    networks:
      - neckwork

  raw-indexer:
    image: snekwork-indexer:latest
    build: .
    container_name: snekwork-raw-indexer
    profiles:
      - worker
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - RPC_URL=${RAW_RPC_URL:-https://rpc.coke.hydration.cloud}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - RPC_RATE_LIMIT=${RAW_RPC_RATE_LIMIT:-50}
      - RPC_CAPACITY=${RAW_RPC_CAPACITY:-10}
      - RPC_HEAD_POLL_MS=${RPC_HEAD_POLL_MS:-}
      - RAW_LIVE_FINALITY_POLL_MS=${RAW_LIVE_FINALITY_POLL_MS:-}
      - RAW_BALANCE_READ_CONCURRENCY=${RAW_BALANCE_READ_CONCURRENCY:-20}
      - RAW_BALANCE_READ_BATCH_ENABLED=${RAW_BALANCE_READ_BATCH_ENABLED:-true}
      - RAW_BALANCE_READ_BATCH_SIZE=${RAW_BALANCE_READ_BATCH_SIZE:-250}
      - RAW_BALANCE_READ_BATCH_CONCURRENCY=${RAW_BALANCE_READ_BATCH_CONCURRENCY:-4}
      - RAW_SNAPSHOT_READ_BATCH_SIZE=${RAW_SNAPSHOT_READ_BATCH_SIZE:-100}
      - RAW_SNAPSHOT_READ_BATCH_CONCURRENCY=${RAW_SNAPSHOT_READ_BATCH_CONCURRENCY:-2}
      - BATCH_SIZE=${RAW_BATCH_SIZE:-50000}
      # Chain time between asset-registry scans. 100 = what the old
      # RAW_ASSET_SNAPSHOT_INTERVAL of 1000 blocks meant at 6s.
      - RAW_ASSET_SNAPSHOT_INTERVAL_MINUTES=${RAW_ASSET_SNAPSHOT_INTERVAL_MINUTES:-}
      - RAW_ASSET_SNAPSHOT_INTERVAL=${RAW_ASSET_SNAPSHOT_INTERVAL:-}
      # One raw_block_snapshots row per N blocks. 1 = today's per-block behaviour.
      # The table is the largest in the database and 36% of all growth, so N is the
      # one pure-config disk lever; N must divide the 600-block pool-history MV grid
      # (checked at startup). Do NOT raise it before the main/price pipeline stops
      # requiring a snapshot row for every block it replays — see the migration runbook.
      - RAW_SNAPSHOT_EVERY_N_BLOCKS=${RAW_SNAPSHOT_EVERY_N_BLOCKS:-1}
      - RAW_PIPELINE_ID=${RAW_PIPELINE_ID:-raw-main}
    command: ["src/raw/cli.ts"]
    networks:
      - neckwork

  raw-live:
    image: snekwork-indexer:latest
    build: .
    container_name: snekwork-raw-live
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      - RPC_URL=${RAW_LIVE_RPC_URL:-https://hydration-rpc.neckwork.net}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - RPC_RATE_LIMIT=${RAW_LIVE_RPC_RATE_LIMIT:-50}
      - RPC_CAPACITY=${RAW_LIVE_RPC_CAPACITY:-10}
      - RPC_HEAD_POLL_MS=${RPC_HEAD_POLL_MS:-}
      - RAW_LIVE_FINALITY_POLL_MS=${RAW_LIVE_FINALITY_POLL_MS:-}
      - RAW_BALANCE_READ_CONCURRENCY=${RAW_BALANCE_READ_CONCURRENCY:-20}
      - RAW_BALANCE_READ_BATCH_ENABLED=${RAW_BALANCE_READ_BATCH_ENABLED:-true}
      - RAW_BALANCE_READ_BATCH_SIZE=${RAW_BALANCE_READ_BATCH_SIZE:-250}
      - RAW_BALANCE_READ_BATCH_CONCURRENCY=${RAW_BALANCE_READ_BATCH_CONCURRENCY:-4}
      - RAW_SNAPSHOT_READ_BATCH_SIZE=${RAW_SNAPSHOT_READ_BATCH_SIZE:-100}
      - RAW_SNAPSHOT_READ_BATCH_CONCURRENCY=${RAW_SNAPSHOT_READ_BATCH_CONCURRENCY:-2}
      - BATCH_SIZE=${RAW_LIVE_BATCH_SIZE:-50000}
      # Chain time between asset-registry scans. 100 = what the old
      # RAW_ASSET_SNAPSHOT_INTERVAL of 1000 blocks meant at 6s.
      - RAW_ASSET_SNAPSHOT_INTERVAL_MINUTES=${RAW_ASSET_SNAPSHOT_INTERVAL_MINUTES:-}
      - RAW_ASSET_SNAPSHOT_INTERVAL=${RAW_ASSET_SNAPSHOT_INTERVAL:-}
      # One raw_block_snapshots row per N blocks. 1 = today's per-block behaviour.
      # The table is the largest in the database and 36% of all growth, so N is the
      # one pure-config disk lever; N must divide the 600-block pool-history MV grid
      # (checked at startup). Do NOT raise it before the main/price pipeline stops
      # requiring a snapshot row for every block it replays — see the migration runbook.
      - RAW_SNAPSHOT_EVERY_N_BLOCKS=${RAW_SNAPSHOT_EVERY_N_BLOCKS:-1}
      - RAW_PIPELINE_ID=raw-live
    command: ["src/raw/cli.ts", "--pipeline-id=raw-live"]
    networks:
      - neckwork

  # Populates price_data.account_identities from the chain's own Identity pallet,
  # on startup and then hourly. Self-seeding so a fresh `docker compose up` gets
  # identities with no manual step.
  identity-snapshot:
    image: snekwork-indexer:latest
    build: .
    container_name: snekwork-identity-snapshot
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      # The first pass writes immediately, so the table has to exist by then.
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      - RPC_URL=${IDENTITY_RPC_URL:-https://hydration-rpc.neckwork.net}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - RPC_RATE_LIMIT=${IDENTITY_RPC_RATE_LIMIT:-20}
      - RPC_CAPACITY=${IDENTITY_RPC_CAPACITY:-5}
    command: ["src/scripts/snapshot-identities.ts", "--loop", "--refresh-hours=${IDENTITY_REFRESH_HOURS:-1}"]
    networks:
      - neckwork

  # Referendum proposal calls. A referendum names its proposal by hash and the call
  # itself lives in a preimage as SCALE bytes, which only runtime metadata can read —
  # hence an indexer-side decoder rather than API-side. A hash IS its content, so a
  # decoded proposal is never revisited and this goes quiet once caught up.
  referendum-proposals:
    image: snekwork-indexer:latest
    build: .
    container_name: snekwork-referendum-proposals
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      # Metadata fetches are heavy and the public endpoints throttle hard when the other
      # snapshot services are busy; this one is not rate limited.
      - RPC_URL=${REFERENDUM_PROPOSAL_RPC_URL:-https://hydration-rpc.neckwork.net}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - RPC_RATE_LIMIT=${REFERENDUM_PROPOSAL_RPC_RATE_LIMIT:-20}
      - RPC_CAPACITY=${REFERENDUM_PROPOSAL_RPC_CAPACITY:-4}
    command: ["src/scripts/decode-referendum-proposals.ts", "--loop",
      "--cycle-minutes=${REFERENDUM_PROPOSAL_CYCLE_MINUTES:-30}",
      "--max=${REFERENDUM_PROPOSAL_MAX:-200}"]
    networks:
      - neckwork

  # Referendum titles from SubSquare. The chain has no human title for a
  # referendum, so "#369" is all the explorer could show without this. Live
  # referenda are re-read every LIVE_REFRESH_MINUTES (Hydration usually has 0-2
  # open); concluded ones are fetched once and then never requested again, which is
  # what keeps the 576 settled referenda from being re-crawled every cycle.
  referendum-titles:
    image: snekwork-indexer:latest
    build: .
    container_name: snekwork-referendum-titles
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - SUBSQUARE_BASE_URL=${SUBSQUARE_BASE_URL:-https://hydration.subsquare.io}
    command: ["src/scripts/snapshot-referendum-titles.ts", "--loop",
      "--cycle-minutes=${REFERENDUM_TITLE_CYCLE_MINUTES:-15}",
      "--live-refresh-minutes=${REFERENDUM_TITLE_LIVE_REFRESH_MINUTES:-30}",
      "--max-fetches=${REFERENDUM_TITLE_MAX_FETCHES:-40}",
      "--delay-ms=${REFERENDUM_TITLE_DELAY_MS:-1500}"]
    networks:
      - neckwork

  # Seed current balances for every account, including dormant accounts with no
  # events in the indexed range, and refresh them on an interval.
  balance-snapshot:
    image: snekwork-indexer:latest
    build: .
    container_name: snekwork-balance-snapshot
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - RPC_URL=${BALANCES_SNAPSHOT_RPC_URL:-https://hydration-rpc.neckwork.net}
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - RPC_RATE_LIMIT=${BALANCES_SNAPSHOT_RPC_RATE_LIMIT:-20}
      - RPC_CAPACITY=${BALANCES_SNAPSHOT_RPC_CAPACITY:-5}
    command: ["src/scripts/snapshot-balances.ts", "--loop", "--refresh-hours=${BALANCES_REFRESH_HOURS:-24}"]
    networks:
      - neckwork

  ingestion-supervisor:
    build:
      context: .
      dockerfile: ops/supervisor.Dockerfile
    container_name: snekwork-ingestion-supervisor
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      raw-live:
        condition: service_started
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-snekwork}
      - ROOT_DIR=/etc/snekwork
      - CLICKHOUSE_DATABASE=price_data
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
      - RAW_RPC_URL=${RAW_RPC_URL:-}
      - RAW_WORKERS=${RAW_WORKERS:-6}
      - RAW_FAILED_RETRY_LIMIT=${RAW_FAILED_RETRY_LIMIT:-3}
      - RAW_BLOCKED_RETRY_AFTER_SECONDS=${RAW_BLOCKED_RETRY_AFTER_SECONDS:-21600}
      # Blocks per backfill range. Block-denominated by design (a range is a unit of
      # indexing work); a faster chain means more ranges per day, not bigger ones.
      # No change needed at a block-time cutover — see scripts/ingestion-supervisor.sh.
      - RANGE_SIZE=${RANGE_SIZE:-1000}
      - MAIN_MAX_RANGES=${MAIN_MAX_RANGES:-3}
      - MAIN_WORKERS=${MAIN_WORKERS:-3}
      - POLL_SECONDS=${POLL_SECONDS:-60}
      - RAW_RATE_LIMIT=${RAW_RATE_LIMIT:-50}
      - RAW_CAPACITY=${RAW_CAPACITY:-10}
      - RAW_BALANCE_READ_CONCURRENCY=${RAW_BALANCE_READ_CONCURRENCY:-20}
      - RAW_BALANCE_READ_BATCH_SIZE=${RAW_BALANCE_READ_BATCH_SIZE:-250}
      - RAW_BALANCE_READ_BATCH_CONCURRENCY=${RAW_BALANCE_READ_BATCH_CONCURRENCY:-4}
      - RAW_SNAPSHOT_READ_BATCH_SIZE=${RAW_SNAPSHOT_READ_BATCH_SIZE:-100}
      - RAW_SNAPSHOT_READ_BATCH_CONCURRENCY=${RAW_SNAPSHOT_READ_BATCH_CONCURRENCY:-2}
      - MAIN_RPC_URL=${MAIN_RPC_URL:-https://hydration-rpc.neckwork.net}
      - MAIN_RATE_LIMIT=${MAIN_RATE_LIMIT:-40}
      - MAIN_CAPACITY=${MAIN_CAPACITY:-8}
      - LIVE_MAIN_ENABLED=${LIVE_MAIN_ENABLED:-true}
      - LIVE_MAIN_NAME=${LIVE_MAIN_NAME:-snekwork-main-live}
      - LIVE_MAIN_PIPELINE_ID=${LIVE_MAIN_PIPELINE_ID:-main-live}
      - LIVE_MAIN_RPC_URL=${LIVE_MAIN_RPC_URL:-https://hydration-rpc.neckwork.net}
      - LIVE_MAIN_RATE_LIMIT=${LIVE_MAIN_RATE_LIMIT:-100}
      - LIVE_MAIN_CAPACITY=${LIVE_MAIN_CAPACITY:-20}
      - LIVE_MAIN_BATCH_SIZE=${LIVE_MAIN_BATCH_SIZE:-50000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /etc/snekwork
    networks:
      - neckwork

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: snekwork-api
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
    networks:
      - neckwork

  # Long-running recompute loop for the derivation jobs in
  # api/src/derivations/jobs.ts (read models a plain materialized view can't
  # express). Same image/env as `api`; gated on schema-bootstrap like every
  # other schema consumer.
  derivations:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: snekwork-api
    container_name: snekwork-derivations
    restart: unless-stopped
    depends_on:
      schema-bootstrap:
        condition: service_completed_successfully
    command: ["./node_modules/.bin/tsx", "src/derivations/runner.ts"]
    environment:
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-dev}
    networks:
      - neckwork

  explorer-ui:
    build:
      context: ./explorer-ui
      dockerfile: Dockerfile
    container_name: snekwork-explorer-ui
    depends_on:
      - api
    ports:
      - "5174:80"
    networks:
      - neckwork

volumes:
  clickhouse_data:
    name: ${CLICKHOUSE_VOLUME_NAME:-snekwork-clickhouse-data}

networks:
  neckwork:
    name: snekwork-network
    driver: bridge
